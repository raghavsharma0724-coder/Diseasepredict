{% extends "base.html" %}

{% block title %}Sign Up - MediPredict AI{% endblock %}

{% block content %}

<section class="hero-section" style="padding: 4.5rem 0 5rem;">
    <div class="container text-center">
        <span class="hero-badge mb-3"><i class="bi bi-person-plus me-2"></i>Join MediPredict AI</span>
        <h1 class="hero-title mt-4 mb-3" style="font-size: 2.6rem;">Create Your Account</h1>
        <p class="hero-subtitle mx-auto">
            Sign up to get your own private prediction history and dashboard.
        </p>
    </div>
</section>

<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="result-section-card">
                    <h5 class="fw-bold mb-4"><i class="bi bi-person-badge me-2 text-primary"></i>Create Account</h5>
                    <form method="POST" action="{{ url_for('signup') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" minlength="3" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter your password" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-predict-submit w-100">
                            <i class="bi bi-person-plus me-2"></i>Sign Up
                        </button>
                    </form>
                    <p class="text-center text-muted mt-4 mb-0">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="fw-semibold">Log in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
